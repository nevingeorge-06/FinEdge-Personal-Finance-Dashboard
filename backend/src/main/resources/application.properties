# ─── Server ──────────────────────────────────────────────────────────────────
server.port=8080

# ─── DataSource ──────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/finedge_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JPA / Hibernate ─────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ─── JWT ─────────────────────────────────────────────────────────────────────
# IMPORTANT: Replace with a 256-bit (32-byte) Base64-encoded secret in production
finedge.jwt.secret=ZmluZWRnZS1zZWNyZXQta2V5LWZvci1qd3QtdG9rZW4tZ2VuZXJhdGlvbi0yMDI2
finedge.jwt.expiration-ms=86400000

# ─── CORS ────────────────────────────────────────────────────────────────────
finedge.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,https://fin-edge-personal-finance-dashboard.vercel.app,https://fin-edge-personal-finance-dashboard-olipgrd6y.vercel.app

# ─── Jackson ─────────────────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ─── Logging ─────────────────────────────────────────────────────────────────
logging.level.com.finedge=INFO
logging.level.org.springframework.security=WARN
